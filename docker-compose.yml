version: '3.8'

services:
    app:
        build:
            context: ./front_end
            dockerfile: Dockerfile
        image: hnc_education_admission_fe
        container_name: hnc_education_admission_fe
        restart: unless-stopped
        tty: true
        working_dir: /app
        environment:
            PORT: 5001
        ports:
            - 5001:80
        depends_on:
            - be
        volumes:
            - ./front_end/docker/nginx_log:/var/log/nginx
        networks:
            - hnc_education_admission
    be:
        build:
            args:
                user: cdev
                uid: 1000
            context: ./back_end
            dockerfile: Dockerfile
        image: hnc_education_admission_be
        container_name: hnc_education_admission_be
        restart: unless-stopped
        depends_on:
            - db
        ports:
            - 8001:81
        working_dir: /var/www
        environment:
            APP_ENV: production
            DB_HOST: db
            DB_PORT: 3306
            DB_DATABASE: db_hnc
            DB_USERNAME: root
            DB_PASSWORD: root
        volumes:
            - ./back_end:/var/www
            - ./docker/nginx_log:/var/log/nginx
            - ./docker/config/back_end.config:/etc/nginx/nginx.conf
            - ./docker/php-fpm/php-fpm.log:/var/log/php-fpm.log
        networks:
            - hnc_education_admission
    db:
        image: mysql:5.7
        container_name: hnc_education_admission_db
        restart: unless-stopped
        ports:
            - 3309:3306
        expose:
            - 3306
        environment:
            MYSQL_DATABASE: db_hnc
            MYSQL_ROOT_PASSWORD: root
        volumes:
            - ./docker/mysql:/var/lib/mysql
        networks:
            - hnc_education_admission
networks:
    hnc_education_admission:
        driver: bridge
